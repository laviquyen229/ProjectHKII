services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hkii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hkii_dev}
      POSTGRES_DB: ${POSTGRES_DB:-hkii}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hkii} -d ${POSTGRES_DB:-hkii}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hkii}:${POSTGRES_PASSWORD:-hkii_dev}@db:5432/${POSTGRES_DB:-hkii}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-Hkii@12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  pgdata:
